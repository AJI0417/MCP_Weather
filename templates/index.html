<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="遊樂園設施狀態管理頁面" />
    <title>設施管理中心</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>

  <body>
    <div class="top-bar"></div>

    <main class="container py-4 py-md-5">
      <div class="page-shell">
        <header
          class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 mb-4"
        >
          <div>
            <p class="eyebrow text-uppercase mb-2">Facility Control</p>
            <h1 class="page-title mb-2">朝陽樂園設施管理中心</h1>
            <p class="page-subtitle mb-0">
              查看園區設施，並快速調整目前開放狀態。
            </p>
          </div>
        </header>

        <form
          id="facilityForm"
          action="{{ url_for('facility.update') }}"
          method="post"
        >
          <section class="management-card" aria-labelledby="facility-list-title">
          <div
            class="toolbar d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 p-3 p-md-4"
          >
            <div>
              <label for="categoryFilter" class="form-label fw-semibold mb-2"
                >設施類別</label
              >
              <select
                id="categoryFilter"
                name="category"
                class="form-select category-select"
                aria-controls="facilityTable"
              >
                <option value="all">全部設施</option>
                <option value="Indoor Facilities">室內設施</option>
                <option value="Outdoor Facilities">室外設施</option>
                <option value="Public Areas">公共區域</option>
              </select>
            </div>

            <p id="resultCount" class="result-count mb-0" aria-live="polite">
              目前顯示 12 項設施
            </p>
          </div>

          <div class="table-responsive">
            <table id="facilityTable" class="table facility-table align-middle">
              <thead>
                <tr>
                  <th scope="col">設施名稱</th>
                  <th scope="col">設施類別</th>
                  <th scope="col" class="text-md-end">設施狀態</th>
                </tr>
              </thead>
              <tbody>
                {% for facility in facilities %}
                  <tr data-category="{{ facility['設施類別'] }}">
                    <td data-label="設施名稱">
                      {{ facility["設施名稱"] }}
                    </td>
                    <td data-label="設施類別">
                      {{ facility["設施類別"] }}
                    </td>
                    <td data-label="設施狀態">
                      <select class="form-select status-select" name="status_{{ facility['id'] }}">
                        <option value="正常開放"
                        {% if facility["設施狀態"] == "正常開放" %} selected {% endif %}
                        >
                        正常開放
                        </option>
                        <option
                          value="暫停開放"
                          {% if facility["設施狀態"] == "暫停開放" %}selected{% endif %}
                        >
                          暫停開放
                        </option>

                        <option
                          value="設施維修中"
                          {% if facility["設施狀態"] == "設施維修中" %}selected{% endif %}
                        >
                          設施維修中
                        </option>
                      </select>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>

          <div
            class="form-actions d-flex flex-column flex-sm-row justify-content-center gap-2 p-3 p-md-4"
          >
            <button type="reset" class="btn action-button">清除</button>
            <button type="submit" class="btn action-button">送出</button>
          </div>
          </section>
        </form>

        <p class="text-center text-secondary small mt-4 mb-0">
          CYUT PARK · Facility Management
        </p>
      </div>
    </main>

    <script>
      const categoryFilter = document.querySelector("#categoryFilter");
      const facilityForm = document.querySelector("#facilityForm");
      const facilityRows = document.querySelectorAll("#facilityTable tbody tr");
      const resultCount = document.querySelector("#resultCount");

      function filterFacilities() {
        const selectedCategory = categoryFilter.value;
        let visibleCount = 0;

        facilityRows.forEach((row) => {
          const shouldShow =
            selectedCategory === "all" ||
            row.dataset.category === selectedCategory;

          row.hidden = !shouldShow;
          if (shouldShow) visibleCount += 1;
        });

        resultCount.textContent = `目前顯示 ${visibleCount} 項設施`;
      }

      function updateStatusStyle(select) {
        select.classList.remove("status-paused", "status-maintenance");

        if (select.value === "暫停開放") {
          select.classList.add("status-paused");
        } else if (select.value === "設施維修中") {
          select.classList.add("status-maintenance");
        }
      }

      categoryFilter.addEventListener("change", filterFacilities);

      document.querySelectorAll(".status-select").forEach((select) => {
        updateStatusStyle(select);
        select.addEventListener("change", () => updateStatusStyle(select));
      });

      facilityForm.addEventListener("reset", () => {
        requestAnimationFrame(() => {
          filterFacilities();
          document.querySelectorAll(".status-select").forEach(updateStatusStyle);
        });
      });
    </script>
  </body>
</html>
